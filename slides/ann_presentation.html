<text x="420" y="156" fill="#484f58" style="font:700 13px sans-serif">// firmware/src/main.cpp  (INFERENCE_MODE, compiled with -DINFERENCE_MODE)</text>
<text x="420" y="182" fill="#8b949e" style="font:12px 'Courier New',monospace">static float  mem1[SNN_HIDDEN] = {};  // ← persistent, never reset</text>
<text x="420" y="202" fill="#8b949e" style="font:12px 'Courier New',monospace">static float  out_acc[2]       = {};  // fault / normal logit sum</text>
<text x="420" y="228" fill="#484f58" style="font:12px 'Courier New',monospace">void loop() &#123;</text>

<text x="420" y="270" fill="#8b949e" style="font:12px 'Courier New',monospace">  float az = mpu.getAccelZ();</text>
<text x="420" y="296" fill="#58a6ff" style="font:12px 'Courier New',monospace">  // ─ delta encode ─</text>
<text x="420" y="316" fill="#d29922" style="font:12px 'Courier New',monospace">  float spike = (|az - prev| &gt; SNN_DELTA_THRESH) ? 1.0f : 0.0f;</text>
<text x="420" y="342" fill="#58a6ff" style="font:12px 'Courier New',monospace">  // ─ FC1 + LIF1: mem1 never zeroed ─</text>
<text x="420" y="362" fill="#3fb950" style="font:12px 'Courier New',monospace">  for (int j=0; j&lt;SNN_HIDDEN; j++) &#123;</text>
<text x="420" y="382" fill="#3fb950" style="font:12px 'Courier New',monospace">    mem1[j] = SNN_BETA1 * mem1[j] + spike * SNN_W1[j];</text>
<text x="420" y="402" fill="#3fb950" style="font:12px 'Courier New',monospace">    if (mem1[j] &gt;= SNN_THRESH1) &#123;</text>

<text x="420" y="442" fill="#f85149" style="font:12px 'Courier New',monospace">      out_acc[0] += SNN_W2[0*HIDDEN+j]; // fault logit</text>
<text x="420" y="462" fill="#58a6ff" style="font:12px 'Courier New',monospace">      out_acc[1] += SNN_W2[1*HIDDEN+j]; // normal logit</text>

<text x="420" y="502" fill="#3fb950" style="font:12px 'Courier New',monospace">  &#125;</text>
<text x="420" y="528" fill="#58a6ff" style="font:12px 'Courier New',monospace">  // ─ classify every 200 samples (~1 second) ─</text>
<text x="420" y="548" fill="#d29922" style="font:12px 'Courier New',monospace">  if (++dec_count &gt;= SNN_DECISION_INTERVAL) &#123;</text>
<text x="420" y="568" fill="#f85149" style="font:12px 'Courier New',monospace">    g_status = (out_acc[1] &lt;= out_acc[0]) ? 1u : 0u; // 1=fault</text>
<text x="420" y="588" fill="#d29922" style="font:12px 'Courier New',monospace">    Serial.print("INF,..."); reset_acc(); &#125;</text>

<script>
const slides=document.querySelectorAll('.slide');
let cur=0;
function go(n){
  slides[cur].classList.remove('active');
  cur=(n+slides.length)%slides.length;
  slides[cur].classList.add('active');
  document.getElementById('pn').textContent=(cur+1)+' / '+slides.length;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
});
document.getElementById('deck').addEventListener('click',e=>{
  if(e.clientX>window.innerWidth/2)go(cur+1);else go(cur-1);
});
</script>
